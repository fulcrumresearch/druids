[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "druids"
version = "0.1.0"
description = "A simpler in-process multi-agent orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["druids"]
include = ["druids/extension.ts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
