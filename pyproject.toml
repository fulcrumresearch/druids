[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramure"
version = "0.0.1"
description = "A simpler in-process multi-agent orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
morph = [
    "morphcloud>=0.1",
]

[project.scripts]
ramure = "ramure.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ramure"]
include = ["ramure/extension.ts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
